# Serves booklet on the shared web_proxy network, where the Cloudflare tunnel (cloudflared) can reach it.
# Tunnel route:  <your-hostname>  ->  http://booklet:8000
# Build and start:  docker compose up -d --build
services:
  app:
    build: .
    image: booklet:latest
    container_name: booklet
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8000"   # local preview only: http://localhost:8087
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
